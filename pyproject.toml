[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsguard"
version = "0.1.0"
description = "Defensive DNS security and configuration analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devansh Shukla"}]
dependencies = ["dnspython>=2.6,<3"]

[project.scripts]
dnsguard = "dnsguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
